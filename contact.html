    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark fixed-top shadow-sm">
        <div class="container">
            <a href="index.html" class="navbar-brand fw-bold text-white">URAS UCKUN</a>
            <button class="navbar-toggler border-0" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav align-items-lg-center text-center pt-3 pt-lg-0">
                    <li class="nav-item">
                        <a href="projects.html" class="nav-link px-3">Projects</a>
                    </li>
                    <li class="nav-item">
                        <a href="contact.html" class="nav-link active text-info px-3">Contact</a>
                    </li>
                    <li class="nav-item py-2 py-lg-0 ms-lg-2">
                        <a href="https://github.com/Urisooo" target="_blank" class="btn btn-outline-info btn-sm px-4 rounded-pill d-inline-flex align-items-center">
                            <i class="bi bi-github me-2"></i> GitHub
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <section class="text-white text-center d-flex align-items-center justify-content-center" style="min-height: 40vh; background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%); padding-top: 100px;">
        <div class="container px-4">
            <h1 class="display-3 fw-bold mb-2">Get In Touch</h1>
            <p class="lead text-muted mx-auto" style="max-width: 500px;">Have an integration inquiry or general question? Drop a secure message module entry below.</p>
        </div>
    </section>

    <section class="py-5" style="background-color: #0f172a;">
        <div class="container px-4">
            <div class="row g-4 justify-content-center">

                <div class="col-12 col-lg-6">
                    <div class="card p-4 border-0 project-card" style="background: #1e293b !important; border-radius: 20px !important;">
                        <h3 class="mb-4 fw-bold text-white">Send Message</h3>
                        <form class="was-validated">
                            <div class="mb-3">
                                <label class="form-label small text-light fw-semibold">Name</label>
                                <input type="text" class="form-control bg-dark border-secondary text-white rounded-3" placeholder="John Doe" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small text-light fw-semibold">Email Address</label>
                                <input type="email" class="form-control bg-dark border-secondary text-white rounded-3" placeholder="john@example.com" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small text-light fw-semibold">Message Body</label>
                                <textarea class="form-control bg-dark border-secondary text-white rounded-3" rows="4" placeholder="Type your project overview parameters here..." required></textarea>
                            </div>
                            <button class="btn btn-info w-100 py-3 fw-bold text-dark rounded-pill mt-2 shadow">Send Inbound Message</button>
                        </form>
                    </div>
                </div>

                <div class="col-12 col-lg-6">
                    <div class="shadow-lg rounded-4 overflow-hidden border border-secondary" style="height: 100%; min-height: 350px; max-height: 480px;">
                        <iframe
                            src="http://googleusercontent.com/maps.google.com/3"
                            width="100%"
                            height="100%"
                            style="border:0; min-height: 350px;"
                            allowfullscreen=""
                            loading="lazy">
                        </iframe>
                    </div>
                </div>

            </div>
        </div>
    </section>
