<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock And Cronometer</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #101820;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 400px;
            background-color: #1f2937;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.4);
        }

        h1 {
            margin-bottom: 25px;
            color: #38bdf8;
        }

        .box {
            background-color: #111827;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .title {
            font-size: 20px;
            margin-bottom: 10px;
            color: #facc15;
        }

        #clock {
            font-size: 36px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        #cronometer {
            font-size: 36px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        button {
            border: none;
            padding: 12px 18px;
            margin: 5px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        #start {
            background-color: #22c55e;
            color: white;
        }

        #stop {
            background-color: #ef4444;
            color: white;
        }

        #reset {
            background-color: #f97316;
            color: white;
        }
        #lap {
            background-color: #06aaaa;
            color: white;
        }

        button:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="container">

        <h1>Digital Clock And Cronometer</h1>

        <div class="box">
            <div class="title">Live Clock</div>
            <div id="clock">00:00:00</div>
        </div>

        <div class="box">
            <div class="title">Cronometer</div>
            <div id="cronometer">00:00:00</div>

            <br><br>

            <button id="start">Start</button>
            <button id="stop">Stop</button>
            <button id="reset">Reset</button>
            <button id="lap">Lap</button>
            <ul id="lapList"></ul>

        </div>

    </div>

   <script src="js/script.js"></script>
</body>
</html>
