                    </li>

            </div>

        </div>

    </nav>

    <!-- Header -->
    <section class="contact-header text-white text-center d-flex align-items-center">

        <div class="container">
            <h1 class="display-3 fw-bold">İletişim</h1>
            <p class="lead">Benimle iletişime geçebilirsiniz.</p>
        </div>

    </section>

    <!-- Contact -->
    <section class="py-5">

        <div class="container">

            <div class="row g-4">

                <!-- Form -->
                <div class="col-lg-6">

                    <div class="card shadow border-0 p-4">

                        <h3 class="mb-4">Mesaj Gönder</h3>

                        <form class="was-validated">

                            <div class="mb-3">
                                <label class="form-label">İsim</label>

                                <input type="text" class="form-control"
                                    placeholder="Tam isminizi giriniz" required>

                                <div class="invalid-feedback">
                                    Lütfen isminizi girin.
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Email</label>

                                <input type="email" class="form-control"
                                    placeholder="Email adresinizi giriniz" required>

                                <div class="invalid-feedback">
                                    Geçerli email girin.
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Telefon</label>

                                <input type="tel" class="form-control"
                                    placeholder="Telefon numaranızı giriniz" required>

                                <div class="invalid-feedback">
                                    Geçerli telefon numarası girin.
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Mesaj</label>

                                <textarea class="form-control"
                                    rows="5"
                                    placeholder="Mesajınızı yazın..."
                                    required></textarea>

                                <div class="invalid-feedback">
                                    Mesajınızı girin.
                                </div>
                            </div>

                            <button class="btn btn-primary w-100">
                                Gönder
                            </button>

                        </form>

                    </div>

                </div>

                <!-- Map -->
                <div class="col-lg-6">

                    <div class="shadow rounded overflow-hidden h-100">

                        <iframe
                            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d102101.70178586012!2d30.635704505535184!3d36.898046384257626!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x14c39aaeddadadc1%3A0x95c69f73f9e32e33!2sAntalya!5e0!3m2!1str!2str!4v1765098980369!5m2!1str!2str"
                            width="100%"
                            height="100%"
                            style="border:0;"
                            allowfullscreen=""
                            loading="lazy">
                        </iframe>

                    </div>

                </div>

            </div>

        </div>

    </section>

            </p>
